[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-governance-kit"
version = "0.1.0"
description = "Governance primitives for agentic AI systems: hash-chained audit logging, redaction, policy-as-code checks, failure-semantics state machine, and human-in-the-loop gates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "All Rights Reserved" }
authors = [{ name = "Matthan Bird", email = "bird.matthan@gmail.com" }]
keywords = ["ai-governance", "audit-log", "human-in-the-loop", "policy-as-code", "agentic-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
# Zero runtime dependencies by design: framework-agnosticism is structural.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_governance_kit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
# Runtime floor is 3.9 (validated by the CI matrix); modern mypy can only
# analyze as 3.10+.
python_version = "3.10"

[tool.coverage.run]
branch = true
